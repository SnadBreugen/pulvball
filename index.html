<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULVBALL / ALBUM PROBE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0b0b; color: #cdc8c3;
    font-family: "SF Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { padding: 14px 18px; border-bottom: 2px solid #2a2a2a;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 15px; letter-spacing: .18em; color: #fff; font-weight: 700; }
  .sub { font-size: 11px; color: #777; letter-spacing: .1em; }
  button { font: inherit; font-size: 11px; letter-spacing: .14em; font-weight: 700;
    padding: 9px 16px; border: 0; border-radius: 3px; background: #f0a500; color: #141414; }
  button:disabled { background: #333; color: #777; }
  button.ghost { background: #222; color: #ddd; }
  main { flex: 1; padding: 14px 18px; overflow: auto; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.5; }
  .ok { color: #7fd48b; }
  .bad { color: #e07a6a; }
  .key { color: #f0a500; }
  .dim { color: #6d6a67; }
  footer { padding: 10px 18px; border-top: 2px solid #2a2a2a; font-size: 11px; color: #777; }
</style>
</head>
<body>

<header>
  <h1>PULVBALL / ALBUM PROBE</h1>
  <span class="sub" id="who">not logged in</span>
  <button id="loginBtn">LOGIN WITH AUDIOTOOL</button>
  <button id="runBtn" class="ghost" disabled>RUN PROBES</button>
  <button id="copyBtn" class="ghost">COPY LOG</button>
</header>

<main><pre id="log"></pre></main>

<footer>Album c1dafcbe-943f-41a1-95fd-1454790b1996 &middot; every answer is printed here, errors included</footer>

<script type="module">
const CLIENT_ID = "881ed17c-c86a-47be-9d6d-179d32d56e5b";
const REDIRECT_URL = window.location.origin + window.location.pathname;
const ALBUM_ID = "c1dafcbe-943f-41a1-95fd-1454790b1996";
const SAMPLE_TRACK = "dzemdp0m";          // "Moving On", from the album

const logEl = document.getElementById("log");
function line(text, cls) {
  const s = document.createElement("span");
  if (cls) s.className = cls;
  s.textContent = text + "\n";
  logEl.appendChild(s);
}
function head(t) { line(""); line("=== " + t + " ===", "key"); }
function show(v) {
  try { line(typeof v === "string" ? v : JSON.stringify(v, null, 2)); }
  catch (e) { line(String(v)); }
}

document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(logEl.textContent).then(
    () => line("[log copied]", "ok"),
    () => line("[copy failed, select by hand]", "bad"));
};

let at = null;

line("redirect url this page will use:", "dim");
line(REDIRECT_URL);
line("it has to match the redirect uri of the application exactly.", "dim");

let audiotool = null;
try {
  ({ audiotool } = await import("https://cdn.jsdelivr.net/npm/@audiotool/nexus/+esm"));
  line("\nsdk loaded", "ok");
} catch (e) {
  line("\nsdk failed to load: " + (e && e.message), "bad");
}

async function connect() {
  if (!audiotool) return;
  try {
    at = await audiotool({
      clientId: CLIENT_ID,
      redirectUrl: REDIRECT_URL,
      scope: "user:read playlist:read offline"
    });
    line("client status: " + at.status, at.status === "authenticated" ? "ok" : "dim");
    if (at.status === "authenticated") {
      const name = (at.userName || "").replace(/^users\//, "");
      document.getElementById("who").textContent = "@" + (name || "unknown");
      document.getElementById("loginBtn").disabled = true;
      document.getElementById("runBtn").disabled = false;
    }
  } catch (e) {
    line("connect failed: " + (e && e.message), "bad");
  }
}
await connect();

document.getElementById("loginBtn").onclick = () => { if (at) at.login(); };

async function tryCall(label, fn) {
  try {
    const r = await fn();
    line("\n" + label + " -> OK", "ok");
    show(r);
  } catch (e) {
    line("\n" + label + " -> " + (e && e.message ? e.message : String(e)), "bad");
  }
}

async function tryUrl(label, url, auth) {
  try {
    const f = auth && at && at.authorizedFetch ? at.authorizedFetch : fetch;
    const res = await f(url, { method: "GET" });
    const ct = res.headers ? res.headers.get("content-type") : "";
    line("\n" + label, "key");
    line(url, "dim");
    line("status " + res.status + "  type " + ct, res.ok ? "ok" : "bad");
    if (res.ok) {
      const txt = await res.text();
      line(txt.slice(0, 1400));
      if (txt.length > 1400) line("... (" + txt.length + " characters in total)", "dim");
    }
  } catch (e) {
    line("\n" + label + " -> " + (e && e.message ? e.message : String(e)), "bad");
  }
}

document.getElementById("runBtn").onclick = async () => {
  logEl.textContent = "";
  line("probing. every answer below is printed as it came back.", "dim");

  head("1  SERVICES ON THE CLIENT");
  for (const k of Object.keys(at)) {
    const v = at[k];
    if (v && typeof v === "object") {
      const methods = Object.keys(v).filter(m => typeof v[m] === "function");
      if (methods.length) line(k + ": " + methods.join(", "));
    } else {
      line(k + ": " + typeof v, "dim");
    }
  }

  head("2  ANYTHING NAMED LIKE PLAYLISTS OR ALBUMS");
  const names = Object.keys(at).filter(k => /playlist|album|track|music|media/i.test(k));
  line(names.length ? names.join(", ") : "nothing with a matching name on the client",
       names.length ? "ok" : "bad");
  for (const n of names) {
    const svc = at[n];
    if (!svc || typeof svc !== "object") continue;
    for (const m of Object.keys(svc).filter(m => typeof svc[m] === "function")) {
      await tryCall(n + "." + m + "({})", () => svc[m]({}));
      await tryCall(n + "." + m + "({name:'playlists/" + ALBUM_ID + "'})",
        () => svc[m]({ name: "playlists/" + ALBUM_ID }));
    }
  }

  head("3  THE ALBUM, THROUGH AN AUTHORIZED REQUEST");
  const candidates = [
    ["album as json", "https://api.audiotool.com/album/" + ALBUM_ID + ".json"],
    ["playlist as json", "https://api.audiotool.com/playlist/" + ALBUM_ID + ".json"],
    ["v1 playlist", "https://api.audiotool.com/v1/playlists/" + ALBUM_ID],
    ["v1 playlist tracks", "https://api.audiotool.com/v1/playlists/" + ALBUM_ID + "/tracks"],
    ["site album json", "https://www.audiotool.com/album/" + ALBUM_ID + ".json"]
  ];
  for (const [label, url] of candidates) await tryUrl(label, url, true);

  head("4  A SINGLE TRACK AND ITS AUDIO");
  await tryUrl("track as json", "https://api.audiotool.com/track/" + SAMPLE_TRACK + ".json", true);
  await tryUrl("legacy mp3 address", "https://api.audiotool.com/track/" + SAMPLE_TRACK + "/play.mp3", false);

  head("5  CAN THE PAGE READ AUDIO DATA AT ALL");
  try {
    const res = await fetch("https://api.audiotool.com/track/" + SAMPLE_TRACK + "/play.mp3");
    line("plain fetch status " + res.status, res.ok ? "ok" : "bad");
    const buf = await res.arrayBuffer();
    line("got " + buf.byteLength + " bytes, so a track can be analysed, not just played", "ok");
  } catch (e) {
    line("plain fetch blocked: " + (e && e.message), "bad");
    line("playing would still work, cutting to the beat would not", "dim");
  }

  line("\ndone. copy the log and send it over.", "key");
};
</script>
</body>
</html>

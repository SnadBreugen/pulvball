<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULVBALL / ALBUM PROBE 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0b0b; color: #cdc8c3;
    font-family: "SF Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { padding: 14px 18px; border-bottom: 2px solid #2a2a2a;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; letter-spacing: .18em; color: #fff; font-weight: 700; }
  .sub { font-size: 11px; color: #777; letter-spacing: .1em; }
  button { font: inherit; font-size: 11px; letter-spacing: .14em; font-weight: 700;
    padding: 9px 16px; border: 0; border-radius: 3px; background: #f0a500; color: #141414;
    cursor: pointer; }
  button:disabled { background: #333; color: #777; cursor: default; }
  button.ghost { background: #222; color: #ddd; }
  main { flex: 1; padding: 14px 18px; overflow: auto; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.5; }
  .ok { color: #7fd48b; }
  .bad { color: #e07a6a; }
  .key { color: #f0a500; }
  .dim { color: #6d6a67; }
  footer { padding: 10px 18px; border-top: 2px solid #2a2a2a; font-size: 11px; color: #777; }
</style>
</head>
<body>

<header>
  <h1>PULVBALL / ALBUM PROBE 2</h1>
  <span class="sub" id="who">not logged in</span>
  <button id="loginBtn" disabled>LOGIN</button>
  <button id="runBtn" class="ghost" disabled>PROBE SERVICES</button>
  <button id="copyBtn" class="ghost">COPY LOG</button>
</header>

<main><pre id="log"></pre></main>

<footer>protobuf services are called by POST to /package.Service/Method, not by GET on a path</footer>

<script>
var logEl = document.getElementById("log");
function line(t, c) { var s = document.createElement("span"); if (c) s.className = c;
  s.textContent = t + "\n"; logEl.appendChild(s); }
function head(t) { line(""); line("=== " + t + " ===", "key"); }
window.addEventListener("error", function (e) { line("[page error] " + (e.message || e.error), "bad"); });
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason; line("[unhandled] " + (r && r.message ? r.message : String(r)), "bad"); });
document.getElementById("copyBtn").onclick = function () {
  navigator.clipboard.writeText(logEl.textContent).then(
    function () { line("[log copied]", "ok"); },
    function () { line("[copy failed, select by hand]", "bad"); }); };

var CLIENT_ID = "881ed17c-c86a-47be-9d6d-179d32d56e5b";
var REDIRECT_URL = window.location.origin + window.location.pathname;
var ALBUM_ID = "c1dafcbe-943f-41a1-95fd-1454790b1996";
var USER = "sandburgen";
var at = null;

line("redirect url: " + REDIRECT_URL, "dim");
</script>

<script type="module">
const SOURCES = [
  "https://cdn.jsdelivr.net/npm/@audiotool/nexus/+esm",
  "https://esm.sh/@audiotool/nexus",
  "https://unpkg.com/@audiotool/nexus?module"
];
function withTimeout(p, ms, label) {
  return Promise.race([p, new Promise((_, rej) =>
    setTimeout(() => rej(new Error(label + " timed out")), ms))]);
}

let audiotool = null;
line("\nloading the sdk...", "dim");
for (const src of SOURCES) {
  try {
    const mod = await withTimeout(import(/* @vite-ignore */ src), 20000, src);
    audiotool = mod.audiotool || (mod.default && mod.default.audiotool);
    if (audiotool) { line("sdk loaded from " + src, "ok"); break; }
  } catch (e) {
    line("failed: " + src + " (" + (e && e.message) + ")", "bad");
  }
}

if (audiotool) {
  try {
    at = await withTimeout(audiotool({
      clientId: CLIENT_ID,
      redirectUrl: REDIRECT_URL,
      scope: "user:read playlist:read offline"
    }), 20000, "client setup");
    line("client status: " + at.status, at.status === "authenticated" ? "ok" : "dim");
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").onclick = () => at.login();
    if (at.status === "authenticated") {
      const n = (at.userName || "").replace(/^users\//, "");
      document.getElementById("who").textContent = "@" + (n || "unknown");
      document.getElementById("loginBtn").disabled = true;
      document.getElementById("runBtn").disabled = false;
    }
  } catch (e) {
    line("client setup failed: " + (e && e.message), "bad");
  }
} else {
  line("no sdk, the probes below need a login so they cannot run", "bad");
}

// a protobuf service is called by posting json to /package.Service/Method
async function rpc(service, method, body) {
  const url = "https://api.audiotool.com/" + service + "/" + method;
  const label = service + "/" + method + "  " + JSON.stringify(body);
  try {
    const f = at && at.authorizedFetch ? at.authorizedFetch : fetch;
    const res = await f(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    });
    const txt = await res.text();
    if (res.ok) {
      line("\n" + label, "key");
      line("status " + res.status, "ok");
      line(txt.slice(0, 2000));
      if (txt.length > 2000) line("... (" + txt.length + " characters in total)", "dim");
      return true;
    }
    // 404 means the service or method does not exist, anything else is more interesting
    line("\n" + label + "  ->  " + res.status + "  " + txt.slice(0, 200),
         res.status === 404 ? "dim" : "bad");
  } catch (e) {
    line("\n" + label + "  ->  " + (e && e.message), "bad");
  }
  return false;
}

document.getElementById("runBtn").onclick = async () => {
  logEl.textContent = "";
  line("every line that is not grey is worth reading.", "dim");

  head("1  THE PLAYLIST THE DOCS NAME OUT LOUD");
  // users/{user}/playlists/published is quoted verbatim in the User docs
  const playlistServices = [
    "audiotool.playlist.v1.PlaylistService",
    "audiotool.playlists.v1.PlaylistService",
    "audiotool.music.v1.PlaylistService"
  ];
  const playlistNames = [
    "users/" + USER + "/playlists/published",
    "playlists/" + ALBUM_ID,
    "users/" + USER + "/playlists/" + ALBUM_ID
  ];
  for (const svc of playlistServices) {
    for (const name of playlistNames) {
      await rpc(svc, "GetPlaylist", { name });
    }
    await rpc(svc, "ListPlaylists", { parent: "users/" + USER });
    await rpc(svc, "ListPlaylistTracks", { parent: "users/" + USER + "/playlists/published" });
    await rpc(svc, "ListTracks", { parent: "playlists/" + ALBUM_ID });
  }

  head("2  ALBUMS");
  const albumServices = [
    "audiotool.album.v1.AlbumService",
    "audiotool.albums.v1.AlbumService",
    "audiotool.music.v1.AlbumService"
  ];
  for (const svc of albumServices) {
    await rpc(svc, "GetAlbum", { name: "albums/" + ALBUM_ID });
    await rpc(svc, "GetAlbum", { name: "users/" + USER + "/albums/" + ALBUM_ID });
    await rpc(svc, "ListAlbums", { parent: "users/" + USER });
    await rpc(svc, "ListAlbumTracks", { parent: "albums/" + ALBUM_ID });
  }

  head("3  TRACKS");
  const trackServices = [
    "audiotool.track.v1.TrackService",
    "audiotool.tracks.v1.TrackService",
    "audiotool.music.v1.TrackService"
  ];
  for (const svc of trackServices) {
    await rpc(svc, "ListTracks", { parent: "users/" + USER });
    await rpc(svc, "GetTrack", { name: "tracks/dzemdp0m" });
    await rpc(svc, "GetTrack", { name: "users/" + USER + "/tracks/dzemdp0m" });
  }

  head("4  WHAT THE CLIENT ITSELF CARRIES");
  for (const k of Object.keys(at)) {
    const v = at[k];
    if (v && typeof v === "object") {
      const m = Object.keys(v).filter(x => typeof v[x] === "function");
      if (m.length) line(k + ": " + m.join(", "));
    }
  }

  line("\ndone. copy the log and send it over.", "key");
  line("grey 404 lines just mean that name does not exist, they are expected.", "dim");
};
</script>
</body>
</html>

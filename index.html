<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winners: Let's Build 2026</title>
    <meta
      name="description"
      content="The winners of Let's Build, the Audiotool Hackathon Series 2026. Six categories, eighteen finalists, built on Audiotool NEXUS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,560&family=Outfit:wght@380;500;640&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #10110e;
        --panel: #171910;
        --ink: #f4f1e8;
        --muted: #aaa496;
        --faint: #6f6a60;
        --line: rgba(244, 241, 232, 0.1);
        --lime: #d6f25c;
        --lime-ink: #172000;
        --serif: "Fraunces", "Iowan Old Style", Palatino, serif;
        --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 72px; }
      body {
        margin: 0;
        background:
          radial-gradient(1100px 520px at 85% -8%, rgba(214, 242, 92, 0.12), transparent 60%),
          radial-gradient(800px 420px at -10% 30%, rgba(214, 242, 92, 0.05), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-weight: 380;
        letter-spacing: 0.01em;
      }
      a { color: inherit; }
      .wrap { width: min(1180px, 100% - 32px); margin: 0 auto; }

      /* Hero */
      .hero { padding: 72px 0 40px; }
      .eyebrow {
        margin: 0 0 18px;
        color: var(--lime);
        font-size: 12px;
        font-weight: 640;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .hero h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 560;
        font-size: clamp(64px, 13vw, 168px);
        letter-spacing: -0.05em;
        line-height: 0.86;
      }
      .hero h1 em { font-style: italic; color: var(--lime); }
      .hero p.lede {
        max-width: 620px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.5;
      }

      /* Category nav */
      .nav {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(16, 17, 14, 0.86);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .nav .wrap {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px 0;
        scrollbar-width: none;
      }
      .nav .wrap::-webkit-scrollbar { display: none; }
      .nav a {
        flex: 0 0 auto;
        text-decoration: none;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 13px;
      }
      .nav a:hover { color: var(--ink); border-color: rgba(214, 242, 92, 0.6); }

      /* Category section */
      .cat { padding: 72px 0 8px; }
      .cat-head {
        display: flex;
        align-items: baseline;
        gap: 18px;
        margin-bottom: 22px;
      }
      .cat-num {
        color: var(--faint);
        font-size: 13px;
        font-weight: 640;
        letter-spacing: 0.12em;
      }
      .cat-head h2 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 560;
        font-size: clamp(30px, 4vw, 46px);
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .winner {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 0;
        border: 1px solid rgba(214, 242, 92, 0.45);
        border-radius: 26px;
        overflow: hidden;
        background:
          linear-gradient(150deg, rgba(214, 242, 92, 0.14), transparent 45%),
          var(--panel);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .media {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #070806;
        align-self: center;
        width: 100%;
      }
      .media iframe, .media video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      .media video { object-fit: contain; }
      .winner-copy {
        padding: 30px 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }
      .badge {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--lime);
        color: var(--lime-ink);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 640;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .winner-title {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 20px;
      }
      .winner h3 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 560;
        font-size: clamp(34px, 4.2vw, 56px);
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .people { margin: 10px 0 0; color: var(--muted); }
      .pitch {
        margin: 18px 0 0;
        font-family: var(--serif);
        font-weight: 560;
        font-size: 19px;
        line-height: 1.4;
        letter-spacing: -0.015em;
        color: #e7e2d6;
      }
      .btn {
        align-self: flex-start;
        margin-top: 22px;
        display: inline-flex;
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 640;
        background: var(--lime);
        color: var(--lime-ink);
      }
      .btn:hover { filter: brightness(1.06); }
      .btn:focus-visible, .runner:focus-visible, .nav a:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 3px;
      }

      .mark {
        flex: 0 0 auto;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #1c1e15;
        box-shadow: inset 0 0 0 1px rgba(244, 241, 232, 0.08);
        font-family: var(--serif);
        font-size: 22px;
      }
      .mark.light { background: #f4f1e8; }
      .mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .mark.small { width: 52px; height: 52px; border-radius: 15px; font-size: 18px; }

      .runners {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 14px;
      }
      .runner {
        display: grid;
        grid-template-columns: auto 52px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 14px 18px 14px 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.02);
        text-decoration: none;
        min-width: 0;
      }
      .runner:hover { border-color: rgba(244, 241, 232, 0.28); }
      .place {
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 560;
        letter-spacing: -0.03em;
        color: var(--ink);
        width: 52px;
      }
      .place sup { font-family: var(--sans); font-size: 11px; font-weight: 640; letter-spacing: 0.06em; margin-left: 1px; }
      .runner.third .place { color: var(--muted); }
      .runner-name { display: block; font-weight: 640; font-size: 17px; letter-spacing: -0.01em; }
      .runner-people {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .runner-copy { min-width: 0; }
      .arrow { color: var(--faint); font-size: 18px; }
      .runner:hover .arrow { color: var(--lime); }

      footer {
        margin-top: 96px;
        border-top: 1px solid var(--line);
        padding: 28px 0 40px;
        color: var(--faint);
        font-size: 13px;
      }
      footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      footer a { color: var(--muted); }

      @media (max-width: 900px) {
        .hero { padding: 48px 0 28px; }
        .winner { grid-template-columns: 1fr; }
        .winner-copy { padding: 22px 20px 24px; }
        .runners { grid-template-columns: 1fr; }
        .cat { padding-top: 52px; }
        .mark { width: 54px; height: 54px; border-radius: 16px; }
        .pitch { font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <header class="hero wrap">
      <p class="eyebrow">Let's Build · Audiotool Hackathon Series 2026</p>
      <h1>The <em>winners</em></h1>
      <p class="lede">
        Six categories, eighteen finalists, one jury. Here are the apps that came out on top,
        all built on Audiotool NEXUS.
      </p>
    </header>

    <nav class="nav" aria-label="Categories"><div class="wrap" id="nav"></div></nav>

    <main class="wrap" id="results"></main>

    <footer>
      <div class="wrap">
        <span>Let's Build · Audiotool Hackathon Series 2026</span>
        <span>v1.0.1</span>
      </div>
    </footer>

    <script>
      window.APPS = [{"id":"ar-assistant","name":"A&R Assistant","team":"Audiosense","people":"Aina Hirata","pitch":"","url":"https://sonisense-artist-hub.base44.app/new","video":{"kind":"video","src":"https://audiotool.github.io/shortlist_letsbuild_part1/videos/audiosense-tutorial.mp4"}},{"id":"lark","name":"Lark","team":"Lark Squad","people":"John Marcos, Ruben Cahayag, Luis Amaraes, and Chris Navarro","pitch":"Lark is for anyone who can hum a melody but can’t play piano or guitar, and doesn’t have a full studio. Record your hum, pick an instrument, and Lark turns it into editable music in Audiotool Studio, so you can hear it, play with it, and keep building.","url":"https://jmarcos3-max.github.io/lark/","video":null},{"id":"harmonic-quest","name":"Harmonic Quest","team":"Harmonic Quest","people":"Aviad Cohen","pitch":"Harmonic Quest is a four-bar, three-choice composition quest that teaches harmony through audible decisions, then writes the finished idea into Audiotool as native, editable instruments, routing, MIDI, and notes through Nexus.","url":"https://harmonic-quest-nexus.aviadcoh.chatgpt.site/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/4TBwmQ8TXBc","href":"https://youtu.be/4TBwmQ8TXBc"}},{"id":"score-io","name":"Score IO","team":"","people":"Josh Williams","pitch":"Audiotool Score IO is a web application that allows Audiotool users to convert project note tracks to MusicXML scores and to create projects based on MusicXML files. This will be useful for creators sharing their compositions with live musicians, notation-first composers starting a project, composers who sketch out ideas in a project before writing notation, and any other users that need to translate between a project and a score. MusicXML files exported from projects are created using a custom heuristic to quantize minor timing variations in live performance to readable rhythms. Files can be previewed in the browser or downloaded as MusicXML files. Imported MusicXML files immediately become new projects in the user's Audiotool account, with a note track for each part.","url":"https://audiotool-score-io.pages.dev","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/0SlEjTcuNxY","href":"https://youtu.be/0SlEjTcuNxY"}},{"id":"magic-deck","name":"Magic Deck","team":"Magic Deck","people":"Tarcan Gul, Alexander Gentil, Gauri Prabhakar, Rukmini Menon","pitch":"Magic Deck is an AI-powered DJ companion that lets users mix, cue, sync, and arrange tracks directly within Audiotool. It supports dual-deck playback, BPM matching, waveform navigation, cue points, EQ, filters, effects, crossfades, and precise timeline placement. It can also generate complementary AI stems such as drums, bass, melodies, and textures, then add and loop them seamlessly in the project. Magic Deck also supports shared project collaboration, local music library browsing, and built-in deck assistance for faster, more intuitive mixing.","url":"https://nexus-app-magic-deck.vercel.app/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/3looUdADabk","href":"https://youtu.be/3looUdADabk"}},{"id":"rhythm-relay","name":"Rhythm Relay","team":"Rhythm Relay","people":"Koa Chang","pitch":"Rhythm Relay: hear a rhythm, tap it from memory, and turn it into editable Audiotool drums.","url":"https://koachang.github.io/rhythm-relay/","video":{"kind":"video","src":"https://koachang.github.io/rhythm-relay/demo.mp4","href":"https://koachang.github.io/rhythm-relay/demo.mp4"}},{"id":"pocket-producer-library","name":"Pocket Producer","team":"","people":"Chuling LI","pitch":"A session-aware retrieval instrument for unfinished music. It reads your open Audiotool project through the Nexus SDK, ranks your own audio fragments by session compatibility, and lets you preview, insert at the playhead, and undo in one transaction.","url":"https://pocketproducer.vercel.app","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/s56Rp_1M9OE","href":"https://youtu.be/s56Rp_1M9OE"}},{"id":"chord-suggester","name":"Chord Suggester","team":"BBC R&D","people":"Brodie Wilson","pitch":"A website for guitar players of any level of experince trying to learn how to play new chords and what music theory is required to build chords. Then once comftable playing the chords they can send them over to there audiotool project to use as drag and drop blocks of chords or in anyway they need!","url":"https://chord-suggester.vercel.app/","video":{"kind":"video","src":"videos/chord-suggester.mp4"}},{"id":"keep-the-beat","name":"Keep the Beat","team":"Wisla the Otter","people":"Adam Borowski","pitch":"Keep the Beat is a 1–5 player cooperative 3D party game that turns making music into something you play. Grab records from four musical racks, run them through physical effect machines, place them on a beat-synced four-layer deck, and PRINT five sections to build a complete song. Nine musical styles and automatic tempo and key adaptation make experimentation approachable even with no production experience. At the end, the arrangement can be sent directly to Audiotool as a real, editable project with its regions and effect chains intact.","url":"https://keepthebeat.games/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/VDNNyz3SGIU","href":"https://www.youtube.com/watch?v=VDNNyz3SGIU"}},{"id":"beatcorn","name":"BeatCorn","team":"BeatCorn","people":"Wassim Zoghlami - Sarra Zoghlami","pitch":"BeatCorn - Music-aware AI visuals for live performance","url":"https://beatcorn.sentientstudios.chatgpt.site/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/Zk2WCC61-UM","href":"https://www.youtube.com/watch?v=Zk2WCC61-UM"}},{"id":"quill","name":"Quill","team":"","people":"Chuling LI","pitch":"Quill turns any recording into a playable instrument inside Audiotool. Record a few seconds of any sound. Quill extracts what it sounds like and how it was played as two separate assets, then re-renders your MIDI regions with real slides, legato, and vibrato that a sampler can't do. Swap the tone, keep the playing style. One click to your timeline.","url":"https://chuling-li-cs--quill-render-serve.modal.run/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/wJ8hX1CCM8w","href":"https://youtu.be/wJ8hX1CCM8w"}},{"id":"shumform","name":"SHUMFORM","team":"SHUMFORM","people":"Anatoli Shumer, solo creator of SHUMFORM.","pitch":"SHUMFORM is an experimental browser-based musical instrument that turns sound creation into a visual, playful experience. Generate sounds, build circular rhythms, connect effects, and shape your performance with hand gestures. Record the full mix and send it directly into an Audiotool project through Nexus, or save it locally as a WAV.","url":"https://shumform.com/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/B8zyvay63jU","href":"https://www.youtube.com/watch?v=B8zyvay63jU&t=48s"}},{"id":"metatron","name":"Metatron","team":"Sumad","people":"Alexander Obst","pitch":"With Metatron, you can use the \"Learn\" function to link Audiotool parameters with parameters created within Metatron. You can then link multiple LFOs to these parameters and transfer the resulting modulation to an automation track in Audiotool. For instance, you can represent a complex instrument, consisting of synths and effects, as a parameter set in Metatron, save it as a preset, and transfer it to another Audiotool project; it is also possible to morph between two presets.","url":"https://metatron-lake.vercel.app/","video":null},{"id":"sigmora","name":"Sigmora","team":"Sigmora","people":"Peter Okoth Otieno (solo)","pitch":"Sigmora is the growth half of the studio. It tells an Audiotool artist what to make from their real audience, writes that idea into their live Audiotool session as a playable project, and turns the finished track into a launch: platform copy, an ElevenLabs-voiced trailer, dubs, sound design and a Stripe pre-save, then marks the campaign back onto their timeline through Nexus.","url":"https://sigmora.org","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/luU7xzFD6rE","href":"https://youtu.be/luU7xzFD6rE"}},{"id":"bbcverb","name":"BBCVerb","team":"BBCVerb","people":"Jack Reynolds","pitch":"BBCVerb for Audiotool puts any recording back in a real room: BBC Maida Vale Studio 1, home of the BBC Symphony Orchestra for 92 years. Sign in with Audiotool, pick a player and one of 80 measured orchestral chairs, and the app renders your track in the cloud through impulse responses captured at that chair on the studio's DPA 4006TL Decca tree. The result comes back into your session as a new track, with its real level, stereo timing and full natural decay. Built on the Audiotool Nexus SDK, it uses the same engine as the BBCVerb plugin.","url":"https://bbcverb.com/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/OpWqw-bAz9c","href":"https://youtu.be/OpWqw-bAz9c"}},{"id":"pocket-producer","name":"Pocket Producer","team":"Pocket Producer","people":"Wadood Ur Rehman Ranjha","pitch":"Pocket Producer turns a users musical idea into an Audiotool project. Describe an idea or a detailed production brief, and an AI producer builds sections, melodies, rhythms, instruments, effects and automation. Explore the music visually, request precise changes while protecting your favourite parts, then copy the arrangement into Audiotool.","url":"https://pocketapi-production.up.railway.app/","video":{"kind":"iframe","src":"https://www.loom.com/embed/bb0a5decbf294ec18245d570e878abb7","href":"https://www.loom.com/share/bb0a5decbf294ec18245d570e878abb7"}},{"id":"brickhouse","name":"BrickHouse","team":"BrickHouse Studios","people":"Anthony Agado","pitch":"BrickHouse is an AI co-producer that works inside Audiotool: find sounds, place them in a live session, listen to the real mix, make native EQ and effect moves through Nexus, and verify the result, while a human approves every write.","url":"https://brickhouse-audio-workbench.vercel.app/","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/hT1-iHOXWKI","href":"https://youtu.be/hT1-iHOXWKI"}},{"id":"seedbed","name":"Seedbed","team":"Seedbed","people":"Diego Pinzon, Dan Thompson","pitch":"Ableton, meet Audiotool. Seedbed connects Ableton Live and Audiotool so producers on different tools can work on the same song.","url":"https://app.seed-bed.com","video":{"kind":"iframe","src":"https://www.youtube-nocookie.com/embed/4A2l2vLnRtU","href":"https://www.youtube.com/watch?v=4A2l2vLnRtU"}}];
    </script>
    <script>
      // Final placings per category, 1st to 3rd.
      const RESULTS = [
        ["music-games", "Music Games & Interactive Experiences", ["keep-the-beat", "rhythm-relay", "magic-deck"]],
        ["ideation", "Ideation & Discovery", ["pocket-producer", "lark", "pocket-producer-library"]],
        ["composition", "Composition & Theory", ["score-io", "harmonic-quest", "chord-suggester"]],
        ["sound-design", "Sound Design & Synthesis", ["bbcverb", "shumform", "quill"]],
        ["connect", "Connect & Integrate", ["seedbed", "brickhouse", "metatron"]],
        ["distribution", "Distribution & Marketing", ["ar-assistant", "sigmora", "beatcorn"]],
      ];

      // Short names for the category nav.
      const SHORT = {
        "music-games": "Music games",
        ideation: "Ideation",
        composition: "Composition",
        "sound-design": "Sound design",
        connect: "Connect",
        distribution: "Distribution",
      };

      // Cleaner credit lines and blurbs where the submitted text does not read well on its own.
      const PEOPLE = {
        shumform: "Anatoli Shumer",
        sigmora: "Peter Okoth Otieno",
        "pocket-producer-library": "Chuling Li",
        quill: "Chuling Li",
        beatcorn: "Wassim Zoghlami, Sarra Zoghlami",
      };
      const NAMES = {
        "pocket-producer": "Pocket Producer",
        "pocket-producer-library": "Pocket Producer",
      };
      const BLURB = {
        "ar-assistant":

      const ICON_TILE_LIGHT = new Set(["beatcorn"]);
      const INK = ["#1c1914", "#14201b", "#241714", "#171c28", "#241e10", "#1c1420"];
      const PAPER = ["#efe2c2", "#c9ead8", "#f3c2b2", "#d5def6", "#f3e0a4", "#f0c6df"];

      const byId = (id) => window.APPS.find((app) => app.id === id);

      function el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (value == null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "html") node.innerHTML = value;
          else node.setAttribute(key, value);
        }
        for (const child of children) if (child) node.append(child);
        return node;
      }

      function hue(id) {
        let n = 0;
        for (const ch of id) n = (n + ch.charCodeAt(0) * 17) % INK.length;
        return n;
      }

      function initials(name) {
        const parts = name.replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function mark(app, small) {
        const src = ICONS[app.id];
        const classes = ["mark", small ? "small" : "", ICON_TILE_LIGHT.has(app.id) ? "light" : ""];
        const box = el("span", { class: classes.filter(Boolean).join(" ") });
        if (src) {
          box.append(el("img", { src, alt: "", loading: "lazy", decoding: "async" }));
        } else {
          const c = hue(app.id);
          box.textContent = initials(app.name);
          box.style.background = PAPER[c];
          box.style.color = INK[c];
        }
        return box;
      }

      const nameOf = (app) => NAMES[app.id] || app.name;
      const peopleOf = (app) => PEOPLE[app.id] || app.people || app.team || "";

      function blurbOf(app) {
        if (BLURB[app.id]) return BLURB[app.id];
        const text = (app.pitch || "").trim();
        if (!text) return "";
        const first = text.split(/(?<=[.!?])\s+/)[0];
        return first.length > 240 ? first.slice(0, 237).trimEnd() + "..." : first;
      }

      function media(app) {
        const video = app.video;
        if (!video) return null;
        const box = el("div", { class: "media" });
        if (video.kind === "iframe") {
          box.append(
            el("iframe", {
              src: video.src,
              title: `${app.name} demo`,
              allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen",
              allowfullscreen: "true",
              loading: "lazy",
            })
          );
          return box;
        }
        if (video.kind === "video") {
          box.append(el("video", { src: video.src, controls: "true", playsinline: "true", preload: "metadata" }));
          return box;
        }
        return null;
      }

      function winnerCard(app) {

          el("span", { class: "badge", text: "Winner" }),
          el("div", { class: "winner-title" }, [

            el("div", {}, [el("h3", { text: nameOf(app) }), el("p", { class: "people", text: peopleOf(app) })]),
          ]),
          blurbOf(app) ? el("p", { class: "pitch", text: blurbOf(app) }) : null,
          app.url
            ? el("a", { class: "btn", href: app.url, target: "_blank", rel: "noopener noreferrer", text: "Open app" })
            : null,
        ]);
        return el("article", { class: "winner" }, [media(app), copy]);
      }

      function runnerCard(app, place) {

          class: place === 2 ? "runner second" : "runner third",
          "aria-label": `${place === 2 ? "Second" : "Third"} place: ${nameOf(app)}`,
        };
        if (app.url) Object.assign(attrs, { href: app.url, target: "_blank", rel: "noopener noreferrer" });
        return el(app.url ? "a" : "div", attrs, [
          el("span", { class: "place", html: label }),
          mark(app, true),
          el("span", { class: "runner-copy" }, [
            el("span", { class: "runner-name", text: nameOf(app) }),
            el("span", { class: "runner-people", text: peopleOf(app) }),
          ]),
          app.url ? el("span", { class: "arrow", text: "↗", "aria-hidden": "true" }) : null,
        ]);
      }

      const nav = document.getElementById("nav");
      const results = document.getElementById("results");

      RESULTS.forEach(([key, label, ids], index) => {
        const [first, second, third] = ids.map(byId);
        nav.append(el("a", { href: `#${key}`, text: SHORT[key] }));
        results.append(
          el("section", { class: "cat", id: key, "aria-labelledby": `${key}-title` }, [
            el("div", { class: "cat-head" }, [
              el("span", { class: "cat-num", text: String(index + 1).padStart(2, "0") }),
              el("h2", { id: `${key}-title`, text: label }),
            ]),
            winnerCard(first),
            el("div", { class: "runners" }, [runnerCard(second, 2), runnerCard(third, 3)]),
          ])
        );
      });
    </script>
  </body>
</html>
